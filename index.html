<style>
/* Layout: sidebar fixa + painel em grade de 12 colunas; cartões de crédito em CSS são o elemento clicável central.
   Pessoa 1 = azul, pessoa 2 = rosa em todo o app, para identificar quem paga cada coisa sem ler. */
:root{
  --lt1:#FFFFFF; --lt2:#EEF2FA; --lbd:#E3E8F1; --wm:#12203F;
  --bg:#F2F4F9; --surface:#FFFFFF; --surface2:#F6F8FC; --line:#E3E8F1;
  --ink:#101828; --muted:#667085; --accent:#2457F5; --accent-ink:#FFFFFF;
  --w:#2457F5; --t:#DE3F78; --a:#12A594; --b:#D97706; --good:#0E8F5F; --bad:#D23B3B; --warn:#B7791F;
  --fix:#0F9D8A; --misc:#8792A6;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px rgba(16,24,40,.06);
  --r:18px;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'Manrope','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --lt1:#1B2440; --lt2:#0B1020; --lbd:transparent; --wm:#FFFFFF;
    --bg:#0D1220; --surface:#151B2D; --surface2:#1B2338; --line:#26304A;
    --ink:#EDF0F8; --muted:#97A1B8; --accent:#5B84FF; --accent-ink:#0B1020;
    --w:#6C8CFF; --t:#FF6B9A; --a:#3CCFBF; --b:#F5B342; --good:#3DD6A0; --bad:#FF8080; --warn:#E8B04A;
    --fix:#33C3AE; --misc:#7C879D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --lt1:#1B2440; --lt2:#0B1020; --lbd:transparent; --wm:#FFFFFF;
  --bg:#0D1220; --surface:#151B2D; --surface2:#1B2338; --line:#26304A;
  --ink:#EDF0F8; --muted:#97A1B8; --accent:#5B84FF; --accent-ink:#0B1020;
  --w:#6C8CFF; --t:#FF6B9A; --a:#3CCFBF; --b:#F5B342; --good:#3DD6A0; --bad:#FF8080; --warn:#E8B04A;
  --fix:#33C3AE; --misc:#7C879D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.big,.money{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:224px minmax(0,1fr);gap:20px;max-width:1380px;margin:0 auto;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:16px;align-self:start;background:var(--surface);border-radius:var(--r);padding:16px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:20px;min-height:calc(100vh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px}
.pair{display:flex}
.pair i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-head);color:#fff;border:2px solid var(--surface);font-style:normal}
.pair i+i{margin-left:-9px}
.logo svg{width:34px;height:34px;display:block}
.brand b{color:var(--wm);font:800 15px var(--f-head);display:block;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:11.5px}
.navlbl{font-size:11px;color:var(--muted);padding:0 10px 6px;letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:10px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:10px;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface2);color:var(--ink);font-weight:600}
.nav button[aria-current="page"] svg{color:var(--accent)}
.side-foot{margin-top:auto;padding:10px;border-radius:12px;background:var(--surface2);font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);margin-top:5px;flex:none}
.dot.off{background:var(--warn)}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.top{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .mo{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.top h1{font:700 22px var(--f-head);letter-spacing:-.02em;margin:0 6px;white-space:nowrap}
.top h1 span{color:var(--muted);font-weight:600}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface2)}
.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.todaylink{border:0;background:none;color:var(--accent);font-weight:600;font-size:12.5px;padding:6px}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
.ttl{font:700 13.5px var(--f-head);margin:0 0 2px;letter-spacing:-.005em}
.sub{color:var(--muted);font-size:12px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}

.big{font:800 44px/1 var(--f-head);letter-spacing:-.03em}
.big small{font-size:.42em;font-weight:700;color:var(--muted);letter-spacing:0}
.big small:first-child{margin-right:.2em}
.big.md{font-size:30px}
.big.neg{color:var(--bad)}
.big.neg small:first-child{color:inherit}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2)}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.good{color:var(--good)}.bad{color:var(--bad)}

.stack{position:relative;display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface2);gap:2px;margin:22px 0 14px}
.stack i{display:block;height:100%;min-width:3px}
.mark{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.mark span{position:absolute;top:-17px;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:var(--muted);font-weight:600}
.stackwrap{position:relative}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px 16px}
.legend div{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:1px}
.legend b{color:var(--ink);font-size:13.5px;font-weight:600}
.legend span.k{display:flex;align-items:center;gap:6px}
.legend span.k::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--misc))}

.ppl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.person{background:var(--surface2);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.person header{display:flex;align-items:center;gap:8px;font:700 14px var(--f-head)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 12px var(--f-head);flex:none}
.av.w,.pair .w{background:var(--w)}.av.t,.pair .t{background:var(--t)}.av.a{background:var(--a)}.av.b{background:var(--b)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.kv b{color:var(--ink);font-weight:600}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--good)}
.split{display:flex;height:26px;border-radius:8px;overflow:hidden;font-size:11.5px;font-weight:700;color:#fff;margin:6px 0 4px}
.split span{display:flex;align-items:center;padding:0 8px;min-width:0;white-space:nowrap}
.split .w{background:var(--w)}.split .t{background:var(--t)}.split .a{background:var(--a)}.split .b{background:var(--b)}.split span:last-child{justify-content:flex-end}

/* Cartões */
.faces{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 12px;margin:0 -2px}
.face{flex:none;width:248px;scroll-snap-align:start;border:0;text-align:left;color:#fff;border-radius:18px;aspect-ratio:1.586;padding:16px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 10px 24px color-mix(in srgb,var(--c1) 38%,transparent);transition:transform .18s ease}
.face::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 90% -10%,rgba(255,255,255,.28),transparent 55%);pointer-events:none}
.face:hover{transform:translateY(-3px)}
.face[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:3px}
.face.big-face{width:100%}
.face .fn{font:800 17px var(--f-head);letter-spacing:-.01em}
.face .chip{width:34px;height:25px;border-radius:6px;background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,.3));border:1px solid rgba(255,255,255,.4)}
.face .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;position:relative;z-index:1}
.face small{display:block;font-size:10px;letter-spacing:.08em;opacity:.78;font-weight:600}
.face b{font:700 16px var(--f-head)}
.face .top2{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.facegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.hint{font-size:12px;color:var(--muted)}

/* Contas a pagar */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.days button{flex:none;min-width:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.days button small{font-size:10px;color:var(--muted);font-weight:500}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days button[aria-pressed="true"] small{color:inherit;opacity:.85}
.bills{display:flex;flex-direction:column}
@media (max-width:860px){.bills{max-height:46vh;overflow-y:auto;overscroll-behavior:contain}}
.bill{display:grid;grid-template-columns:minmax(0,1fr);justify-items:start;gap:6px 10px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.bill:first-child{border-top:0}
.bill .nm{font-weight:600;overflow-wrap:break-word}
.bill>*{justify-self:start;min-width:0;max-width:100%}
.bill .chips{justify-content:flex-start}
.bill .due{font-size:11.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:24px;align-items:start}
.cxs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.cxs>div{background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.cxs small{font-size:11.5px;color:var(--muted)}
.cxs b{font:700 15px var(--f-head)}
.pbar.g i{background:var(--good)}
@media (max-width:980px){.cx{grid-template-columns:minmax(0,1fr)}}
.chipb{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 9px 4px 6px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chipb .ck{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--cc);display:grid;place-items:center;color:#fff}
.chipb.w{--cc:var(--w)}.chipb.t{--cc:var(--t)}.chipb.a{--cc:var(--a)}.chipb.b{--cc:var(--b)}
.chipb.paid{background:color-mix(in srgb,var(--cc) 12%,transparent);border-color:transparent;color:var(--muted);text-decoration:line-through}
.chipb.paid .ck{background:var(--cc)}
.chipb:disabled{opacity:.35;cursor:default}
.chipb .ck svg{width:11px;height:11px;stroke-width:3;opacity:0}
.chipb.paid .ck svg{opacity:1}

/* Projeção */
.proj{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end}
.pj{background:var(--surface2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;height:150px;justify-content:flex-end;position:relative}
.pj.now{outline:0;box-shadow:inset 0 0 0 2px var(--accent)}
.pj .bar{border-radius:6px;background:color-mix(in srgb,var(--accent) 55%,var(--surface2));min-height:4px}
.pj.now .bar{background:var(--accent)}
.pj b{font-size:12px;white-space:nowrap;overflow:visible}
.pj span{font-size:11px;color:var(--muted);font-weight:600}
button.pj{border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;transition:background .15s}
button.pj:hover{background:var(--line)}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:6px 8px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.progs{display:flex;flex-direction:column;gap:22px}
.prog .who{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.pc{font:700 14px var(--f-head)}
.pbar{height:14px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:9px 0 7px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--w);transition:width .3s ease}
.prog.t .pbar i{background:var(--t)}.prog.a .pbar i{background:var(--a)}.prog.b .pbar i{background:var(--b)}
.minifat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.minifat .pj{height:auto;min-height:84px}

/* Tabelas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:left;font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th.r,td.r{text-align:right}
th.c,td.c{text-align:center}
tr:last-child td{border-bottom:0}
.cell{width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 8px;min-width:0}
.cell:hover{background:var(--surface2)}
.cell:focus{background:var(--surface);border-color:var(--accent);outline:0}
.cell.n{text-align:right;font-variant-numeric:tabular-nums}
select.cell{appearance:auto;cursor:pointer;font-size:12.5px;color:var(--muted)}
.dw{color:var(--w)}.dt{color:var(--t)}.da{color:var(--a)}.db{color:var(--b)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.tot td{font-weight:700;border-top:2px solid var(--line)}
.sec{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.sec h2{font:700 15px var(--f-head);margin:0;flex:1;display:flex;gap:8px;align-items:center}
.sw{width:10px;height:10px;border-radius:3px;background:var(--c,var(--misc))}
.stackcol{display:flex;flex-direction:column;gap:16px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.bigline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}

/* Detalhe do cartão */
.detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-size:14px;color:var(--ink);font-weight:500;width:100%}
.field input[type=color]{padding:2px;height:38px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,25,.5);display:flex;overflow-y:auto;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:20px;padding:22px;width:min(440px,100%);max-height:100%;margin:auto;flex:none;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:14px}
.modal h3{font:800 18px var(--f-head);margin:0}
.acts{display:flex;gap:8px;justify-content:flex-end}
.modal .acts{position:sticky;bottom:-22px;background:var(--surface);padding:12px 0 22px;margin:0 0 -22px;z-index:1}

.tabbar{display:none}
@media (min-width:981px){.cols{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}.leftcol,.rightcol{display:flex;flex-direction:column;gap:16px;min-width:0}.leftcol>section,.rightcol>section{min-width:0}}
@media (max-width:980px){.cols,.leftcol,.rightcol{display:contents}.grid>.welcome{order:0}.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}}
/* celular: sem balançar de lado ao arrastar o dedo */
@media (max-width:860px){html,body{overflow-x:hidden;touch-action:pan-y pinch-zoom;max-width:100%}}
@media (max-width:980px){
  .c8,.c7,.c6,.c5,.c4{grid-column:span 12}
  .detail{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}

function monthAdd(k,n){var a=k.split('-');var y=+a[0],m=+a[1]-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0')}
function mTitle(k){var a=k.split('-');return MESES[+a[1]-1]+' <span>'+a[0]+'</span>'}
function monthDiff(a,b){var x=a.split('-'),y=b.split('-');return (+y[0]-+x[0])*12+(+y[1]-+x[1])}
/* cada lançamento tem um "sid": o mesmo sid liga o lançamento de um mês às cópias dos meses seguintes */
function fillSids(m){var used={};m.items.forEach(function(it){if(it.sid)used[it.sid]=1});
  m.items.forEach(function(it){if(it.sid)return;var b='l-'+it.g+'-'+norm(it.n).replace(/\s+/g,'_'),s=b,c=1;while(used[s]){c++;s=b+'#'+c}used[s]=1;it.sid=s})}
function carry(items,skip){var out=[];for(var i=0;i<items.length;i++){var it=items[i];
  if(skip&&skip[it.sid])continue;
  if(it.rec)out.push(Object.assign({},it,{id:uid()},unpaid()));
  else if((it.rest||0)>1)out.push(Object.assign({},it,{id:uid(),rest:it.rest-1},unpaid()))}return out}
function getMonth(k){
  var keys=Object.keys(S.months).sort(),prev=null,i;
  for(i=0;i<keys.length;i++){if(keys[i]<k)prev=keys[i]}
  /* pulou meses? cria um por um, para as parcelas descerem uma a uma */
  if(prev&&!S.months[k]){var gap=monthDiff(prev,k);for(i=1;i<gap&&i<240;i++)getMonth(monthAdd(prev,i));
    keys=Object.keys(S.months).sort();prev=null;for(i=0;i<keys.length;i++){if(keys[i]<k)prev=keys[i]}}
  var pm=prev?getMonth(prev):null;
  if(pm)fillSids(pm);
  if(!S.months[k]){
    if(pm){S.months[k]={inc:Object.assign({},pm.inc),save:Object.assign({},pm.save||{}),items:carry(pm.items)}}
    else{S.months[k]={inc:{w:0,t:0},save:{w:0,t:0},items:[]}}
  }else if(pm){
    var m=S.months[k];fillSids(m);
    var skip={};(m.del||[]).forEach(function(x){skip[x]=1});
    var carried=carry(pm.items,skip),bySid={},claimed={};
    m.items.forEach(function(x){bySid[x.sid]=x});
    carried.forEach(function(c){claimed[c.sid]=1});
    carried.forEach(function(ci){
      if(bySid[ci.sid])return;
      var twin=null;
      for(var j=0;j<m.items.length;j++){var x=m.items[j];
        if(x.g===ci.g&&norm(x.n)===norm(ci.n)&&!claimed[x.sid]){twin=x;break}}
      if(twin){twin.sid=ci.sid;bySid[ci.sid]=twin}
      else{m.items.push(ci);bySid[ci.sid]=ci}
    });
  }
  return S.months[k];
}
/* uma mudança num lançamento fixo/parcelado vale deste mês em diante */
function propagate(k,it){if(!it||!it.sid)return;
  Object.keys(S.months).sort().forEach(function(j){if(j<=k)return;
    var d=monthDiff(k,j),m=S.months[j],idx=-1;
    for(var i=0;i<m.items.length;i++){if(m.items[i].sid===it.sid){idx=i;break}}
    if(idx<0)return;
    if(!(it.rec||(it.rest||0)>d)){m.items.splice(idx,1);return}
    var t=m.items[idx];t.n=it.n;t.g=it.g;PK.forEach(function(q){t[q]=it[q]});t.dia=it.dia;t.rec=!!it.rec;t.rest=it.rec?0:it.rest-d})}
function removeForward(k,sid){Object.keys(S.months).forEach(function(j){if(j>k)S.months[j].items=S.months[j].items.filter(function(x){return x.sid!==sid})})}
function groups(){var g=[{id:'fixos',name:'Fixos',color:'var(--fix)',kind:'fixos'}];
  S.cards.forEach(function(c){g.push({id:c.id,name:c.name,color:c.color,kind:'card',card:c})});
  g.push({id:'outros',name:'Gastos',color:'var(--misc)',kind:'outros'});return g}
function calc(){
  var m=getMonth(UI.cur),it=m.items,per={},R=0,G=0,PD=0;
  PS().forEach(function(k){var r=(m.inc&&m.inc[k])||0,g=sum(it,k),pend=sum(it.filter(function(i){return !i[pf(k)]}),k);
    per[k]={r:r,g:g,s:r2(r-g),pend:pend};R+=r;G+=g;PD+=pend});
  return {m:m,items:it,per:per,r:r2(R),g:r2(G),s:r2(R-G),pend:r2(PD)}
}
function shade(hex,p){if(hex.charAt(0)!=='#')return hex;var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  var f=p<0?0:255,t=Math.abs(p);r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}

function canon(o){if(o===null||typeof o!=='object')return JSON.stringify(o);if(Array.isArray(o))return '['+o.map(canon).join(',')+']';return '{'+Object.keys(o).sort().map(function(k){return JSON.stringify(k)+':'+canon(o[k])}).join(',')+'}'}
function setSync(st){

function chk(r){if(r&&r.error)throw r.error;return r}
function finish(ok){
  saving=false;clearTimeout(retryTimer);
  if(ok){SYNCST='ok'}else{SYNCST='err';retryTimer=setTimeout(flush,15000)}
  setSync();
  if(again){again=false;flush()}
}
function flush(){
  clearTimeout(saveTimer);saveTimer=null;
  if(!remote||!CASAL)return;
  if(saving){again=true;return}
  var cur=keyMap(),ups=[],dels=[];
  Object.keys(cur).forEach(function(k){if(synced[k]!==cur[k])ups.push(k)});
  Object.keys(synced).forEach(function(k){if(!(k in cur))dels.push(k)});
  if(!ups.length&&!dels.length){SYNCST='ok';setSync();return}
  saving=true;
  var rows=ups.map(function(k){return {casal_id:CASAL.id,chave:k,dados:JSON.parse(cur[k]),atualizado_em:new Date().toISOString()}});
  var p=Promise.resolve();
  if(rows.length)p=p.then(function(){return SB.from('estado').upsert(rows,{onConflict:'casal_id,chave'})}).then(chk);
  if(dels.length)p=p.then(function(){return SB.from('estado').delete().eq('casal_id',CASAL.id).in('chave',dels)}).then(chk);
  p.then(function(){ups.forEach(function(k){synced[k]=cur[k]});dels.forEach(function(k){delete synced[k]});finish(true)},function(){finish(false)})
}
function busyField(){var a=document.activeElement,v=document.getElementById('view');return !!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&v&&v.contains(a))}

function applyRemote(chave,dados,del){
  var cur=keyMap();
  if((chave in cur)&&synced[chave]!==cur[chave])return;
  if(del){
    if(chave.indexOf('m:')!==0||!((chave in cur)||(chave in synced)))return;
    delete S.months[chave.slice(2)];delete synced[chave]
  }else{
    if(!dados||typeof dados!=='object')return;
    if((chave in cur)&&canon(dados)===canon(JSON.parse(cur[chave])))return;
    if(chave==='config'){if(dados.names)S.names=dados.names;if(dados.cards)S.cards=dados.cards;S.np=dados.np||2;S.st=dados.st|0;S.goal=dados.goal||0;if(Array.isArray(dados.goals))S.goals=dados.goals;S.pc=dados.pc||{}}
    else if(chave.indexOf('m:')===0){S.months[chave.slice(2)]=dados}
    else return;
    synced[chave]=keyMap()[chave]
  }
  try{localStorage.setItem(LSK,JSON.stringify(core()))}catch(e){}
  if(!cardOf(UI.sel))UI.sel=S.cards.length?S.cards[0].id:null;
  softRender()
}
function refresh(){
  if(!remote||!CASAL)return Promise.resolve();
  return SB.from('estado').select('chave,dados').eq('casal_id',CASAL.id).then(function(r){
    if(r.error||!r.data)return;
    var seen={};
    r.data.forEach(function(row){seen[row.chave]=1;applyRemote(row.chave,row.dados,false)});
    Object.keys(synced).forEach(function(k){if(!seen[k])applyRemote(k,null,true)});
    if(SYNCST==='err'&&!saving){SYNCST='ok';setSync()}
  },function(){})
}
function readCache(){try{var c=JSON.parse(localStorage.getItem(LSK)||'null');if(c&&c.months&&c.cards&&c.names)return c}catch(e){}return null}
function loadRemote(){
  return SB.from('estado').select('chave,dados').eq('casal_id',CASAL.id).then(function(r){
    if(r.error)throw r.error;
    var rows=r.data||[];
    if(!rows.length){S=blank();synced={};return 'novo'}
    var base=blank(),cfg=null,months={};
    rows.forEach(function(row){if(row.chave==='config')cfg=row.dados;else if(row.chave.indexOf('m:')===0)months[row.chave.slice(2)]=row.dados});
    if(!Object.keys(months).length)months[NOWKEY]={inc:{w:0,t:0},save:{w:0,t:0},items:[]};
    S={v:1,names:(cfg&&cfg.names)||base.names,np:(cfg&&cfg.np)||2,cards:(cfg&&cfg.cards)||[],goal:cfg?(cfg.goal||0):0,goals:(cfg&&Array.isArray(cfg.goals))?cfg.goals:undefined,pc:(cfg&&cfg.pc)||{},st:(cfg&&cfg.st)|0,months:months};
    synced={};var km=keyMap();
    rows.forEach(function(row){if(km[row.chave]!==undefined)synced[row.chave]=km[row.chave]});
    return 'ok'
  }).catch(function(err){
    var c=readCache();if(!c)throw err;
    S=c;synced=keyMap();return 'cache'
  })
}
function subscribe(){
  if(channel){try{SB.removeChannel(channel)}catch(e){}channel=null}
  channel=SB.channel('estado-'+CASAL.id).on('postgres_changes',{event:'*',schema:'public',table:'estado',filter:'casal_id=eq.'+CASAL.id},function(p){
    try{
      if(p.eventType==='DELETE'){if(p.old&&p.old.chave&&(!p.old.casal_id||p.old.casal_id===CASAL.id))applyRemote(p.old.chave,null,true)}
      else if(p.new&&p.new.chave)applyRemote(p.new.chave,p.new.dados,false)
    }catch(e){}
  }).subscribe()
}
function teardown(){
  remote=false;clearTimeout(saveTimer);clearTimeout(retryTimer);

  channel=null;CASAL=null;

  authedUid=null;synced={};S=blank();UI.cur=NOWKEY;UI.view='geral';UI.sel=null;SYNCST='conn'
}
function tr(err){
  var m=(err&&err.message)||String(err||'');
  if(/Invalid login credentials/i.test(m))return 'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(m))return 'Confirme seu e-mail com o código que enviamos antes de entrar.';
  if(/Token has expired|otp_expired|invalid.*(token|otp)|token.*invalid|expired or is invalid/i.test(m))return 'Código inválido ou expirado. Confira os números ou peça um código novo.';
  if(/Error sending|sending (confirmation|recovery|magic)/i.test(m))return 'Não consegui enviar o e-mail agora. Tente de novo em alguns minutos.';
  if(/already registered|already been registered/i.test(m))return 'Já existe uma conta com este e-mail. Use Entrar.';
  if(/Password should be at least/i.test(m))return 'A senha precisa ter pelo menos 8 caracteres.';
  if(/same password|different from the old/i.test(m))return 'Use uma senha diferente da anterior.';
  if(/rate limit|too many|security purposes/i.test(m))return 'Muitas tentativas. Espere alguns minutos e tente de novo.';
  if(/codigo_invalido/.test(m))return 'Código não encontrado. Confira com quem criou o grupo.';
  if(/casal_cheio/.test(m))return 'Esse grupo já está cheio (limite de quatro pessoas).';
  if(/ja_tem_casal/.test(m))return 'Esta conta já faz parte de um grupo.';
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m))return 'Sem conexão com a internet.';
  return 'Algo deu errado. Tente de novo.'
}

function afterAuth(){
  if(!SESSION||!SESSION.user)return;
  authedUid=SESSION.user.id;LSK=LS_KEY+':'+authedUid;
  authView('loading');
  SB.from('casais').select('id,codigo').limit(1).then(function(r){

  }).catch(function(err){

    if(c&&c.id&&readCache()){CASAL=c;return enterApp()}

}
function enterApp(){
  authView('loading');

    remote=true;
    try{localStorage.setItem('bolso-casal:'+authedUid,JSON.stringify(CASAL))}catch(e){}
    UI.cur=NOWKEY;UI.sel=S.cards.length?S.cards[0].id:null;
    subscribe();

    showApp();
    if(modo==='novo'){SYNCST='pend';setSync();flush()}
    else if(modo==='cache'){clearTimeout(retryTimer);retryTimer=setTimeout(function(){refresh().then(flush)},5000)}
  }).catch(function(err){AUTH.detail=errDetail(err);authView('neterr',tr(err))})

function btnBusy(form,on){var b=form&&form.querySelector('button[type=submit]');if(b)b.disabled=!!on}
function verifyCode(email,code,types){
  var t=types[0];
  return SB.auth.verifyOtp({email:email,token:code,type:t}).then(function(r){
    if(r.error&&types.length>1)return verifyCode(email,code,types.slice(1));
    return r})
}
function doAuth(form){
  var m=form.dataset.m,emailEl=form.querySelector('#aEmail'),passEl=form.querySelector('#aPass'),codeEl=form.querySelector('#aCode');
  var email=emailEl?emailEl.value.trim():AUTH.email,pass=passEl?passEl.value:'',numEl=form.querySelector('#aCodeNum'),num=numEl?numEl.value.replace(/\D/g,''):'';
  if(emailEl)AUTH.email=email;
  btnBusy(form,true);
  var fail=function(err){authView(m==='join'?'setup':m,tr(err))};
  if(m==='login'){
    SB.auth.signInWithPassword({email:email,password:pass}).then(function(r){
      if(r.error){
        if(/Email not confirmed/i.test(r.error.message||'')){
          SB.auth.resend({type:'signup',email:email}).then(function(){AUTH.resendAt=Date.now()+60000;authView('verify','Seu e-mail ainda não foi confirmado. Enviamos um código novo para você.','ok')},function(){authView('verify','Seu e-mail ainda não foi confirmado. Toque em Reenviar código.','err')});return}
        fail(r.error)}
      else btnBusy(form,false)},fail)
  }else if(m==='signup'){
    if(pass.length<8){authView('signup','A senha precisa ter pelo menos 8 caracteres.');return}
    SB.auth.signUp({email:email,password:pass}).then(function(r){
      if(r.error)return fail(r.error);
      if(r.data&&r.data.user&&r.data.user.identities&&r.data.user.identities.length===0)return fail(new Error('already registered'));
      if(!r.data||!r.data.session){AUTH.resendAt=Date.now()+60000;authView('verify')}
    },fail)
  }else if(m==='verify'){
    if(num.length<6){authView('verify','Digite o código que chegou no e-mail.');return}
    verifyCode(AUTH.email,num,['email','signup']).then(function(r){if(r.error)return fail(r.error);btnBusy(form,false)},fail)
  }else if(m==='forgot'){
    SB.auth.resetPasswordForEmail(email).then(function(r){
      if(r.error)return fail(r.error);
      AUTH.resendAt=Date.now()+60000;authView('resetcode')
    },fail)
  }else if(m==='resetcode'){
    if(num.length<6){authView('resetcode','Digite o código que chegou no e-mail.');return}
    if(pass.length<8){authView('resetcode','A nova senha precisa ter pelo menos 8 caracteres.');return}
    recovering=true;
    verifyCode(AUTH.email,num,['recovery']).then(function(r){
      if(r.error){recovering=false;return fail(r.error)}
      return SB.auth.updateUser({password:pass}).then(function(u){
        if(u.error){authView('recover',tr(u.error));return}
        recovering=false;authedUid=null;afterAuth()
      })
    }).catch(function(err){recovering=false;fail(err)})
  }else if(m==='recover'){
    if(pass.length<8){authView('recover','A senha precisa ter pelo menos 8 caracteres.');return}
    SB.auth.updateUser({password:pass}).then(function(r){
      if(r.error)return fail(r.error);
      recovering=false;authedUid=null;afterAuth()
    },fail)
  }else if(m==='join'){
    var code=(codeEl?codeEl.value:'').trim();AUTH.code=code;
    SB.rpc('entrar_casal',{p_codigo:code}).then(function(r){
      if(r.error)return fail(r.error);
      return SB.from('casais').select('id,codigo').limit(1).then(function(q){
        if(q.error||!q.data||!q.data.length)throw (q.error||new Error('codigo_invalido'));
        CASAL=q.data[0];return enterApp()
      })
    }).catch(fail)
  }
}
function boot(){
  if(!REMOTE_ON){remote=false;SYNCST='local';showApp();return}
  try{
    var hh=location.hash||'';
    if(/error_description=/.test(hh)){
      var ec=(/error_code=([^&]+)/.exec(hh)||[])[1]||'',ed=(/error_description=([^&]+)/.exec(hh)||[])[1]||'';
      HASHERR=ec==='otp_expired'?'Esse link do e-mail já foi usado ou expirou. Se a sua conta já foi confirmada, é só entrar abaixo. Se não, toque em Criar conta com o mesmo e-mail para receber outro link.':decodeURIComponent(ed.replace(/\+/g,' '));
      history.replaceState(null,'',location.pathname+location.search)
    }
  }catch(e){}
  authView('loading');
  if(!window.supabase||!window.supabase.createClient){authView('neterr','Não consegui carregar o login. Verifique a internet e tente de novo.');return}
  SB=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  SB.auth.onAuthStateChange(function(ev,session){
    setTimeout(function(){
      SESSION=session;
      if(ev==='PASSWORD_RECOVERY'){recovering=true;authView('recover');return}
      if(ev==='SIGNED_OUT'){teardown();authView('login');return}
      if(ev==='INITIAL_SESSION'&&!session){if(!recovering){var he=HASHERR;HASHERR='';authView('login',he)}return}
      if((ev==='INITIAL_SESSION'||ev==='SIGNED_IN')&&session&&!recovering&&authedUid!==session.user.id)afterAuth()
    },0)
  });
  window.addEventListener('online',function(){if(remote)refresh().then(flush)});
  function flushNow(){if(remote&&saveTimer){clearTimeout(saveTimer);saveTimer=null;flush()}}
  window.addEventListener('pagehide',flushNow);
  document.addEventListener('visibilitychange',function(){if(document.hidden)flushNow();else if(remote)refresh().then(flush)})
}

function bills(m){
  var out=[];
  m.items.forEach(function(it){if((it.g==='fixos'||it.g==='outros')&&itTot(it)>0)out.push({key:'i'+it.id,name:it.n,dia:it.dia||null,kind:it.g==='fixos'?'Conta fixa':'Gasto',items:[it]})});
  S.cards.forEach(function(c){var its=m.items.filter(function(i){return i.g===c.id});if(sumP(its)>0)out.push({key:'c'+c.id,name:'Fatura '+c.name,dia:c.venc||null,kind:'cartao',items:its})});
  out.sort(function(a,b){if(a.dia===b.dia)return a.name.localeCompare(b.name);if(a.dia==null)return -1;if(b.dia==null)return 1;return a.dia-b.dia});
  return out
}

function gSum(g,f){var t=0;PS().forEach(function(k){t+=(g[f]&&g[f][k])||0});return r2(t)}
function gPer(g){var o={};PS().forEach(function(k){o[k]=(g.cur&&g.cur[k])||0});return o}
function gTotals(){var L=goalsList(),cur=0,tg=0,per={};PS().forEach(function(k){per[k]=0});
  L.forEach(function(g){PS().forEach(function(k){var v=(g.cur&&g.cur[k])||0;per[k]+=v;cur+=v});tg+=g.target||0});
  return {cur:r2(cur),tg:r2(tg),per:per,n:L.length}}
function gPct(g){var t=g.target||0;return t>0?Math.min(100,Math.round(gSum(g,'cur')/t*100)):0}
function monthName(k){var a=k.split('-');return MESES[+a[1]-1]+' '+a[0]}
function gForecast(g){
  if(!(g.target>0))return '';
  var rem=r2(g.target-gSum(g,'cur')),ap=gSum(g,'ap');
  if(rem<=0)return 'Meta alcançada';
  if(!(ap>0))return '';
  return monthName(monthAdd(NOWKEY,Math.ceil(rem/ap)))
}
function pchips(per){return NP()>1?'<div class="pchips">'+PS().map(function(k){return '<span class="pchip '+k+'">'+esc(pname(k))+': '+money(per[k]||0)+'</span>'}).join('')+'</div>':''}
function pbarG(p,label){return '<div class="pbar g" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p+'" aria-label="'+esc(label)+'"><i style="width:'+p+'%"></i></div>'}
function caixaCard(){
  var L=goalsList(),T=gTotals();
  var body=L.length?
    '<div class="bigline" style="margin:0 0 10px">'+big(T.cur,'md')+'</div>'+
    L.slice(0,3).map(function(g){return '<div style="margin-bottom:8px"><div class="kv"><span>'+esc(g.name)+'</span><span>'+(g.target>0?gPct(g)+'%':money(gSum(g,'cur')))+'</span></div>'+(g.target>0?pbarG(gPct(g),'Progresso de '+g.name):'')+'</div>'}).join('')+
    '<button class="btn ghost sm" data-act="nav" data-v="metas">Ver metas</button>':
    '<div class="hint" style="margin-bottom:10px">Crie uma meta para juntar dinheiro: viagem, reserva de emergência, o que quiser.</div><button class="btn ghost sm" data-act="goaladd">'+ic('plus')+'Criar meta</button>';
  return '<section'+secAttrs('g:caixa','card c7 o7')+'><div class="hd">'+colBtn('g:caixa','<div><span class="ttl">Metas</span><div class="sub">O que você está juntando.</div></div><span class="cs">'+money(T.cur)+'</span>')+'</div><div class="cbody">'+body+'</div></section>'
}
function goalCard(g){
  var cur=gSum(g,'cur'),pc=gPct(g),fc=gForecast(g),rem=Math.max(0,r2((g.target||0)-cur));
  return '<section class="card goal"><div class="gh"><button class="gname" data-act="goaledit" data-id="'+esc(g.id)+'" aria-label="Editar meta '+esc(g.name)+'">'+esc(g.name)+'</button>'+(g.target>0?'<span class="gpct">'+pc+'% completo</span>':'')+'</div>'+
    (g.target>0?pbarG(pc,'Progresso de '+g.name):'')+
    '<div class="gval">'+money(cur)+(g.target>0?' <span>de '+money(g.target)+'</span>':'')+'</div>'+pchips(gPer(g))+
    '<div class="gfoot"><span>Meta: '+(g.date?monthName(g.date):'sem prazo')+'</span>'+(g.target>0&&rem>0?'<span>Falta '+money(rem)+'</span>':'')+(fc?'<span>'+(fc==='Meta alcançada'?fc:'Previsão: '+fc)+'</span>':'')+'</div>'+
    '<div class="gact"><button class="btn sm" data-act="goaldep" data-id="'+esc(g.id)+'">Guardar</button><button class="btn ghost sm" data-act="goaledit" data-id="'+esc(g.id)+'">Editar</button></div></section>'
}
function vMetas(){
  var L=goalsList(),T=gTotals(),pct=T.tg>0?Math.min(100,Math.round(T.cur/T.tg*100)):0;
  var info=(NP()>1?PS().map(function(k){return esc(pname(k))+' '+money(T.per[k])}).join(' + '):'')+(NP()>1&&T.tg>0?' • ':'')+(T.tg>0?pct+'% do total das metas ('+money(T.tg)+')':(T.n?'':(NP()>1?' · ':'')+'Crie sua primeira meta abaixo.'));
  return '<div class="stackcol"><section class="card"><div class="hd"><div><h2 class="ttl">Metas</h2><div class="sub">Total guardado</div></div><button class="btn sm" data-act="goaladd">'+ic('plus')+'Nova meta</button></div>'+
    '<div class="bigline" style="margin:8px 0 8px">'+big(T.cur)+'</div>'+(T.tg>0?pbarG(pct,'Progresso total das metas'):'')+(info?'<div class="hint">'+info+'</div>':'')+'</section>'+

function findGoal(id){var L=goalsList();for(var i=0;i<L.length;i++)if(L[i].id===id)return L[i];return null}

    '<div class="sub">Aporte mensal (usado na previsão)</div><div class="frow">'+PS().map(function(k){return '<label class="field">'+esc(pname(k))+' (R$)<input data-ga="'+k+'" inputmode="decimal" placeholder="0,00" value="'+(g&&g.ap&&g.ap[k]?inVal(g.ap[k]):'')+'"></label>'}).join('')+'</div>'+

  md.hidden=false;fitModal();if(!isMob())setTimeout(function(){var n=document.getElementById('gN');if(n)n.focus()},30)

function openDep(id){
  var g=findGoal(id);if(!g)return;
  var md=document.getElementById('modal');
  md.innerHTML='<form class="modal" id="depForm" data-id="'+esc(id)+'" role="dialog" aria-modal="true" aria-label="Guardar em '+esc(g.name)+'"><h3>'+esc(g.name)+'</h3>'+
    '<div class="frow"><label class="field">O que fazer<select id="dK"><option value="add">Guardar</option><option value="sub">Retirar</option></select></label>'+
    (NP()>1?'<label class="field">Quem<select id="dP">'+PS().map(function(k){return '<option value="'+k+'">'+esc(pname(k))+'</option>'}).join('')+'</select></label>':'')+'</div>'+
    '<label class="field">Valor (R$)<input id="dV" inputmode="decimal" placeholder="0,00" required></label>'+

  md.hidden=false;fitModal();if(!isMob())setTimeout(function(){var n=document.getElementById('dV');if(n)n.focus()},30)
}
function saveGoal(form){
  var id=form.dataset.id,g=id?findGoal(id):null;
  if(!g){g={id:'g'+uid().slice(-8),name:'',target:0,date:'',cur:{},ap:{}};goalsList().push(g)}
  g.name=document.getElementById('gN').value.trim()||'Meta';
  g.target=Math.max(0,parseNum(document.getElementById('gT').value));
  var d=document.getElementById('gD').value.trim();g.date=/^\d{4}-\d{2}$/.test(d)?d:'';
  g.cur=g.cur||{};g.ap=g.ap||{};
  [].forEach.call(form.querySelectorAll('[data-gc]'),function(i){g.cur[i.dataset.gc]=Math.max(0,parseNum(i.value))});
  [].forEach.call(form.querySelectorAll('[data-ga]'),function(i){g.ap[i.dataset.ga]=Math.max(0,parseNum(i.value))});
  closeModal();change()
}
function saveDep(form){
  var g=findGoal(form.dataset.id);if(!g)return;
  var pe=document.getElementById('dP'),p=pe?pe.value:PS()[0],v=parseNum(document.getElementById('dV').value);
  if(!(v>0))return;
  g.cur=g.cur||{};var sign=document.getElementById('dK').value==='sub'?-1:1;
  g.cur[p]=Math.max(0,r2((g.cur[p]||0)+sign*v));
  closeModal();change()
}
function settle(c){
  var ps=PS(),avg=r2(c.s/ps.length),tx=[];
  var d=ps.map(function(k){return {k:k,v:r2(c.per[k].s-avg)}});
  var debt=d.filter(function(x){return x.v<-0.004}).sort(function(a,b){return a.v-b.v});
  var cred=d.filter(function(x){return x.v>0.004}).sort(function(a,b){return b.v-a.v});
  var i=0,j=0;
  while(i<debt.length&&j<cred.length){var a=r2(Math.min(-debt[i].v,cred[j].v));
    if(a>=0.01)tx.push({from:debt[i].k,to:cred[j].k,v:a});
    debt[i].v=r2(debt[i].v+a);cred[j].v=r2(cred[j].v-a);
    if(debt[i].v>-0.005)i++;if(cred[j].v<0.005)j++}
  return {tx:tx,avg:avg}
}

  var pendTotal=0,pendN=0;bl.forEach(function(b){var any=false;PS().forEach(function(p){if(billSum(b,p)>0&&!billPaid(b,p)){pendTotal+=billSum(b,p);any=true}});if(any)pendN++});
  var list=shown.length?shown.map(function(b){return '<div class="bill"><div style="min-width:0"><div class="nm">'+esc(b.name)+'</div><div class="due">'+(b.dia?'vence dia '+b.dia:'sem dia definido')+'</div></div><div class="chips">'+PS().map(function(p){return chip(b,p)}).join('')+'</div></div>'}).join(''):'<div class="empty">Nada a pagar neste mês.</div>';

  var cardsHtml=S.cards.length?'<div class="faces">'+S.cards.map(function(cd){return face(cd)}).join('')+'</div>':'<div class="empty">Nenhum cartão cadastrado. Adicione em Ajustes.</div>';

  var pStart=(UI.cur>=NOWKEY&&UI.cur<=monthAdd(NOWKEY,4))?NOWKEY:UI.cur;

  if(!cardOf(UI.sel))UI.sel=S.cards[0].id;

  var its=m.items.filter(function(i){return i.g===c.id});
  var ps=PS(),tp={},pp={};
  ps.forEach(function(k){tp[k]=sum(its,k);pp[k]=tp[k]>0&&its.filter(function(i){return i[k]>0}).every(function(i){return i[pf(k)]})});
  var tot=sumP(its);

}

function planSelect(i){
  var v=planOf(i),o='<option value="once"'+(v==='once'?' selected':'')+'>Só este mês</option><option value="rec"'+(v==='rec'?' selected':'')+'>Todo mês</option>';
  for(var k=1;k<=12;k++)o+='<option value="p'+k+'"'+(v==='p'+k?' selected':'')+'>'+k+(k>1?' parcelas':' parcela')+'</option>';
  return '<select class="cell" data-f="plan" data-id="'+esc(i.id)+'" aria-label="Parcelas de '+esc(i.n)+'">'+o+'</select>'
}
function vLanc(){
  var c=calc(),ps=PS(),N=ps.length;
  var inc='<section class="card"><div class="sec"><h2><span class="sw" style="--c:var(--good)"></span>Renda</h2></div><div class="tw"><table><thead><tr><th>Detalhe</th>'+ps.map(function(k){return '<th class="r">'+esc(pname(k))+' (R$)</th>'}).join('')+'</tr></thead><tbody><tr><td style="padding-left:14px">Entrada mensal</td>'+
    ps.map(function(k){return '<td><input class="cell n d'+k+'" value="'+inVal(c.per[k].r)+'" inputmode="decimal" data-f="inc" data-p="'+k+'" aria-label="Renda de '+esc(pname(k))+'"></td>'}).join('')+'</tr></tbody></table></div></section>';
  var secs=groups().map(function(g){
    var its=c.items.filter(function(i){return i.g===g.id});
    var hasDia=g.kind!=='card';
    var rows=its.map(function(i){return '<tr><td class="c-n"><input class="cell" value="'+esc(i.n)+'" data-f="n" data-id="'+esc(i.id)+'" aria-label="Descrição"></td>'+
      ps.map(function(k){return '<td class="c-v" data-l="'+esc(pname(k))+' (R$)"><input class="cell n d'+k+'" value="'+inVal(i[k]||0)+'" inputmode="decimal" data-f="'+k+'" data-id="'+esc(i.id)+'" aria-label="Valor '+esc(pname(k))+'"></td>'}).join('')+
      (hasDia?'<td class="c-d" data-l="Dia" style="width:64px"><input class="cell n" value="'+(i.dia||'')+'" placeholder="dia" inputmode="numeric" data-f="dia" data-id="'+esc(i.id)+'" aria-label="Dia de vencimento"></td>':'')+
      '<td class="c-p" data-l="Parcelas" style="min-width:130px">'+planSelect(i)+'</td>'+
      ps.map(function(k){return '<td class="c c-pd" data-l="'+esc(pname(k))+' pagou"><input type="checkbox" data-f="'+pf(k)+'" data-id="'+esc(i.id)+'"'+(i[pf(k)]?' checked':'')+' aria-label="'+esc(pname(k))+' pagou"></td>'}).join('')+
      '<td class="c c-x"><button class="iconbtn" style="width:30px;height:30px;border:0" data-act="del" data-id="'+esc(i.id)+'" aria-label="Remover '+esc(i.n)+'">'+ic('trash')+'</button></td></tr>'}).join('');
    var body=its.length?rows:'<tr><td colspan="'+(N*2+(hasDia?4:3))+'"><div class="empty" style="border:0;padding:14px">Sem lançamentos aqui.</div></td></tr>';
    return '<section'+secAttrs('l:'+g.id,'card')+'><div class="sec">'+colBtn('l:'+g.id,'<span class="sw" style="--c:'+esc(g.color)+'"></span>'+esc(g.name)+'<span class="sub num">'+money(sumP(its))+'</span>')+'<button class="btn ghost sm" data-act="add" data-g="'+esc(g.id)+'" aria-label="Adicionar lançamento">'+ic('plus')+'<span class="lbl">Adicionar</span></button></div>'+
      '<div class="cbody"><div class="tw"><table class="lt"><thead><tr><th>Detalhe</th>'+ps.map(function(k){return '<th class="r">'+esc(pname(k))+' (R$)</th>'}).join('')+(hasDia?'<th class="r">Dia</th>':'')+'<th>Parcelas</th>'+ps.map(function(k){return '<th class="c">'+esc(pname(k).slice(0,5))+' pagou</th>'}).join('')+'<th></th></tr></thead><tbody>'+body+'</tbody></table></div></div></section>'
  }).join('');
  function trow(l,f,cls){return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+l+'</td>'+ps.map(function(k){var v=f(k);return '<td class="r num'+(cls?' '+(v<0?'bad':'good'):'')+'">'+money(v)+'</td>'}).join('')+'</tr>'}
  var tots='<section class="card tots"><div class="sec"><h2>Totais do mês</h2></div><div class="tw"><table><thead><tr><th></th>'+ps.map(function(k){return '<th class="r">'+esc(pname(k))+'</th>'}).join('')+'<th class="r">Total</th></tr></thead><tbody>'+
    '<tr><td>Renda</td>'+ps.map(function(k){return '<td class="r num">'+money(c.per[k].r)+'</td>'}).join('')+'<td class="r num">'+money(c.r)+'</td></tr>'+
    '<tr><td>Total de gastos</td>'+ps.map(function(k){return '<td class="r num">'+money(c.per[k].g)+'</td>'}).join('')+'<td class="r num">'+money(c.g)+'</td></tr>'+
    '<tr><td>Falta pagar</td>'+ps.map(function(k){return '<td class="r num">'+money(c.per[k].pend)+'</td>'}).join('')+'<td class="r num">'+money(c.pend)+'</td></tr>'+
    '<tr class="tot"><td>O que sobrou</td>'+ps.map(function(k){var v=c.per[k].s;return '<td class="r num '+(v<0?'bad':'good')+'">'+money(v)+'</td>'}).join('')+'<td class="r num '+(c.s<0?'bad':'good')+'">'+money(c.s)+'</td></tr></tbody></table></div></section>';
  return '<div class="stackcol">'+inc+secs+tots+'</div>'
}

function contaCard(){
  if(!remote)return '<section class="card"><h2 class="ttl">Sincronização</h2><div class="sub">Este app está em modo local: os dados ficam só neste aparelho. Para sincronizar entre aparelhos e pessoas, preencha o arquivo config.js (veja o LEIA-ME).</div></section>';
  var email=(SESSION&&SESSION.user&&SESSION.user.email)||'';
  return '<section class="card"><div class="hd"><div><h2 class="ttl">Conta e grupo</h2><div class="sub" id="syncTxt2">'+esc(SYNCTXT[SYNCST])+'</div></div><button class="btn ghost sm" data-act="logout">Sair</button></div>'+
    '<div style="display:flex;flex-direction:column;gap:14px;margin-top:4px"><div class="field">Sua conta<div style="font-size:14px;color:var(--ink);font-weight:500;overflow-wrap:anywhere;word-break:normal">'+esc(email)+'</div></div>'+
    '<div class="field">Código do grupo<div style="display:flex;gap:10px;align-items:center;justify-content:space-between"><b style="font:800 17px var(--f-head);letter-spacing:.06em;color:var(--ink)">'+esc(fmtCode(CASAL&&CASAL.codigo))+'</b><button class="btn ghost sm" data-act="copycode" data-code="'+esc(fmtCode(CASAL&&CASAL.codigo))+'">Copiar</button></div></div></div>'+
    '<div class="hint" style="margin-top:10px">Quem tiver o código pode entrar no grupo (limite de quatro pessoas). Compartilhe só com quem você quer que veja seus dados.</div>'+
    '<div style="margin-top:12px"><button class="btn ghost sm" data-act="leavegrp">Sair do grupo</button></div></section>'
}
function modeSeg(){
  var n=NP();
  var h='<div class="seg" role="group" aria-label="Modo de uso" style="margin-bottom:14px">'+[[1,'Solo'],[2,'Duo'],[3,'Grupo']].map(function(o){var on=o[0]===1?n===1:o[0]===2?n===2:n>=3;return '<button data-act="np" data-n="'+o[0]+'" aria-pressed="'+on+'">'+o[1]+'</button>'}).join('')+'</div>';
  if(n>=3)h+='<div class="seg" role="group" aria-label="Quantas pessoas no grupo" style="margin-bottom:14px">'+[3,4].map(function(x){return '<button data-act="np" data-n="'+x+'" aria-pressed="'+(n===x)+'">'+x+' pessoas</button>'}).join('')+'</div>';
  return h
}
function personRow(k,i){
  var c=(S.pc&&S.pc[k])||'var(--'+k+')';
  return '<div class="field">Pessoa '+(i+1)+'<span class="namebox"><input value="'+esc(pname(k))+'" data-f="name" data-p="'+k+'" aria-label="Nome da pessoa '+(i+1)+'"><button type="button" class="dotbtn" style="background:'+c+'" data-act="palopen" data-p="'+k+'" aria-expanded="'+(UI.pal===k)+'" aria-label="Escolher a cor de '+esc(pname(k))+'"></button></span>'+(UI.pal===k?palette(k):'')+'</div>'
}
function vAjustes(){
  var cards=S.cards.map(function(c){return '<tr><td><input class="cell" value="'+esc(c.name)+'" data-f="cname" data-id="'+esc(c.id)+'" aria-label="Nome do cartão"></td>'+
    '<td style="width:96px"><input class="cell n" value="'+(c.venc||'')+'" inputmode="numeric" data-f="cvenc" data-id="'+esc(c.id)+'" placeholder="dia" aria-label="Dia de vencimento"></td>'+
    '<td style="width:70px"><input type="color" value="'+esc(c.color)+'" data-f="ccolor" data-id="'+esc(c.id)+'" aria-label="Cor do cartão" style="width:44px;height:32px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px"></td>'+
    '<td class="c"><button class="iconbtn" style="width:30px;height:30px;border:0" data-act="delcard" data-id="'+esc(c.id)+'" aria-label="Remover cartão '+esc(c.name)+'">'+ic('trash')+'</button></td></tr>'}).join('');
  if(!cards)cards='<tr><td colspan="4" class="sub">Nenhum cartão ainda. Toque em “Cartão” para adicionar o primeiro.</td></tr>';
  return '<div class="stackcol">'+contaCard()+themeCard()+'<section class="card"><h2 class="ttl">Pessoas, nomes e cores</h2><div class="sub" style="margin-bottom:12px">Escolha Solo, Duo ou Grupo (até 4 pessoas). Toque na bolinha para trocar a cor de cada uma. Quem sai da lista deixa de entrar nas contas, mas os valores ficam guardados.</div>'+modeSeg()+'<div class="frow">'+PS().map(personRow).join('')+'</div></section>'+
  '<section class="card"><div class="hd"><div><h2 class="ttl">Cartões</h2><div class="sub">Dia de vencimento de cada fatura e cor do cartão.</div></div><button class="btn sm" data-act="addcard">'+ic('plus')+'Cartão</button></div>'+
    '<div class="tw"><table><thead><tr><th>Nome</th><th class="r">Vence dia</th><th>Cor</th><th></th></tr></thead><tbody>'+cards+'</tbody></table></div></section>'+
  '<section class="card"><h2 class="ttl">Dados</h2><div class="sub" style="margin-bottom:12px">'+(remote?'As mudanças valem para todo o grupo. ':'')+'Começar do zero apaga tudo o que você cadastrou (renda, lançamentos, cartões, metas e nomes) e volta ao início, como uma conta nova. Seu e-mail e sua senha não mudam.</div>'+
    (UI.confirmReset?'<div class="acts" style="justify-content:flex-start"><button class="btn danger" data-act="reset2">'+'Sim, apagar tudo e começar do zero'+'</button><button class="btn ghost" data-act="reset0">Cancelar</button></div>':'<div class="acts" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn ghost" data-act="reset1" data-k="zero">Começar do zero</button></div>')+'</section></div>'
}

/* ---------- render ---------- */
var NAV=[['geral','home','Visão geral'],['cartoes','card','Cartões'],['lancamentos','list','Contas'],['metas','target','Metas'],['ajustes','gear','Ajustes']];
function render(){
  applyColors();
  document.getElementById('pairA').innerHTML=LOGO;
  document.getElementById('nav').innerHTML=NAV.map(function(n){return '<button data-act="nav" data-v="'+n[0]+'"'+(UI.view===n[0]?' aria-current="page"':'')+'>'+ic(n[1])+n[2]+'</button>'}).join('');
  var tbh=NAV.filter(function(n){return n[0]!=='ajustes'}).map(function(n){return '<button data-act="nav" data-v="'+n[0]+'"'+(UI.view===n[0]?' aria-current="page"':'')+'>'+ic(n[1])+n[2].replace('Visão geral','Geral')+'</button>'});tbh.splice(2,0,'<button class="tabadd" data-act="add" aria-label="Adicionar lançamento">'+ic('plus')+'</button>');document.getElementById('tabbar').innerHTML=tbh.join('');
  document.getElementById('mTitle').innerHTML=mTitle(UI.cur);
  document.querySelector('[data-act=mprev]').innerHTML=ic('l');document.querySelector('[data-act=mnext]').innerHTML=ic('r');
  document.getElementById('addBtn').innerHTML=ic('plus')+'<span class="lbl">Adicionar</span>';document.getElementById('addBtn').setAttribute('aria-label','Adicionar lançamento');
  document.getElementById('todayBtn').hidden=UI.cur===NOWKEY;applyTheme();
  var sb=document.getElementById('setBtn');sb.innerHTML=ic('gear');if(UI.view==='ajustes')sb.setAttribute('aria-current','page');else sb.removeAttribute('aria-current');
  var v=document.getElementById('view');
  var scrollers=v.querySelectorAll('.faces');var sx=scrollers.length?scrollers[0].scrollLeft:0;
  v.innerHTML=UI.view==='geral'?vGeral():UI.view==='cartoes'?vCartoes():UI.view==='lancamentos'?vLanc():UI.view==='metas'?vMetas():vAjustes();
  var f=v.querySelector('.faces');if(f)f.scrollLeft=sx;
  [].forEach.call(v.querySelectorAll('.proj'),function(pr){var sl=pr.querySelector('.pj.now');if(sl&&pr.scrollWidth>pr.clientWidth){pr.scrollLeft=sl.getBoundingClientRect().left-pr.getBoundingClientRect().left+pr.scrollLeft-(pr.clientWidth-sl.offsetWidth)/2}});
  setSync();autoSave()
}

/* ---------- modal ---------- */
function openAdd(g){
  var gs=groups();var def=g||(UI.view==='cartoes'&&UI.sel?UI.sel:gs[0].id);
  var opts=gs.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===def?' selected':'')+'>'+esc(x.id==='fixos'?'Fixos (casa, internet…)':x.id==='outros'?'Outros gastos':x.name)+'</option>'}).join('');
  var plan='<option value="once">Só este mês</option><option value="rec">Todo mês</option>';for(var k=1;k<=12;k++)plan+='<option value="p'+k+'">'+k+(k>1?' parcelas':' parcela')+'</option>';
  var mks=[];for(var i=0;i<=6;i++)mks.push(monthAdd(NOWKEY,i));if(mks.indexOf(UI.cur)<0){mks.push(UI.cur);mks.sort()}
  var mo=mks.map(function(mk){return '<option value="'+mk+'"'+(mk===UI.cur?' selected':'')+'>'+monthName(mk)+'</option>'}).join('');
  var md=document.getElementById('modal');
  md.innerHTML='<form class="modal" id="addForm" role="dialog" aria-modal="true" aria-label="Novo lançamento"><h3>Novo lançamento</h3>'+
    '<label class="field">Onde entra<select id="fG">'+opts+'</select></label>'+
    '<label class="field">Descrição<input id="fN" placeholder="Ex.: Mercado, Compra no débito…" required></label>'+
    '<div class="frow">'+PS().map(function(k){return '<label class="field">'+esc(pname(k))+' paga (R$)<input id="f'+k.toUpperCase()+'" data-pv="'+k+'" inputmode="decimal" placeholder="0,00"></label>'}).join('')+'</div>'+
    '<label class="field">Mês em que entra<select id="fM">'+mo+'</select></label>'+
    '<div class="frow"><label class="field">Parcelas<select id="fP">'+plan+'</select></label><label class="field">Dia de vencimento<input id="fD" type="number" min="1" max="31" placeholder="opcional"></label></div>'+
    '<div class="acts"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button type="submit" class="btn">Salvar</button></div></form>';
  md.hidden=false;fitModal();
  setTimeout(function(){var n=document.getElementById('fN');if(n)n.focus()},30)
}
function fitModal(){
  var md=document.getElementById('modal'),vv=window.visualViewport;if(!md)return;
  if(md.hidden||!vv){md.style.top='';md.style.height='';md.style.bottom='';return}
  md.style.top=vv.offsetTop+'px';md.style.height=vv.height+'px';md.style.bottom='auto'
}
try{if(window.visualViewport){window.visualViewport.addEventListener('resize',fitModal);window.visualViewport.addEventListener('scroll',fitModal)}}catch(e){}
/* botão/gesto de voltar: cada aba e cada balão viram uma entrada no histórico */
function goView(v){resetCol();UI.view=v;try{history.pushState({v:v},'','#'+v)}catch(x){}}
try{history.replaceState({v:UI.view},'','#'+UI.view)}catch(e){}
var MODAL_ON=false,SKIP_POP=false,POP_CLOSE=false;
(function(){var md=document.getElementById('modal');if(!md||!window.MutationObserver)return;
  new MutationObserver(function(){
    if(!md.hidden&&!MODAL_ON){MODAL_ON=true;try{history.pushState({m:1},'')}catch(x){}}
    else if(md.hidden&&MODAL_ON){MODAL_ON=false;
      if(!POP_CLOSE&&history.state&&history.state.m){SKIP_POP=true;try{history.back()}catch(x){SKIP_POP=false}}
      POP_CLOSE=false}
  }).observe(md,{attributes:true,attributeFilter:['hidden']});
  window.addEventListener('popstate',function(e){
    if(SKIP_POP){SKIP_POP=false;return}
    if(MODAL_ON){POP_CLOSE=true;closeModal();return}
    var s=e.state;if(s&&s.v&&s.v!==UI.view){resetCol();UI.view=s.v;render();window.scrollTo(0,0)}
  })
})();
document.addEventListener('visibilitychange',function(){if(document.hidden&&Object.keys(COL).length){resetCol();try{render()}catch(x){}}});
function openLeave(err){
  var md=document.getElementById('modal');
  md.innerHTML='<form class="modal" id="leaveForm" role="dialog" aria-modal="true" aria-label="Sair do grupo"><h3>Sair do grupo?</h3>'+
    '<div class="sub" style="margin-bottom:8px">Você perde o acesso aos dados deste grupo. As outras pessoas continuam com tudo, inclusive o que você lançou.</div>'+
    '<div class="sub" style="margin-bottom:8px">Depois de sair, você pode criar um grupo só seu (Solo) ou entrar em outro com um código. Seu e-mail e sua senha continuam os mesmos.</div>'+
    '<div class="sub" style="margin-bottom:12px"><b>Se você for a única pessoa do grupo, os dados dele serão apagados.</b></div>'+
    (err?'<div class="amsg err" style="margin-bottom:10px">'+esc(err)+'</div>':'')+
    '<div class="acts"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button type="submit" class="btn" style="background:#D6334A">Sim, sair do grupo</button></div></form>';
  md.hidden=false;fitModal()
}
function closeModal(){var md=document.getElementById('modal');md.hidden=true;md.innerHTML='';fitModal()}
function applyPlan(it,val){it.rec=false;it.rest=0;if(val==='rec')it.rec=true;else if(val.charAt(0)==='p')it.rest=parseInt(val.slice(1),10)||0}
function findItem(id){var m=getMonth(UI.cur);for(var i=0;i<m.items.length;i++)if(m.items[i].id===id)return m.items[i];return null}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='modal')closeModal();return}
  var a=el.dataset.act,m;
  if(a==='tog'){var kk=el.dataset.k,sec=el.closest('[data-col]');COL[kk]=!isCol(kk);
    if(sec)sec.classList.toggle('closed',COL[kk]);el.setAttribute('aria-expanded',String(!COL[kk]));return}
  if(a==='pcol'){S.pc=S.pc||{};if(el.dataset.c)S.pc[el.dataset.p]=el.dataset.c;else delete S.pc[el.dataset.p];change();return}
  if(a==='nav'){var nv=el.dataset.v;if(nv!==UI.view)goView(nv);render();window.scrollTo(0,0)}
  else if(a==='mprev'){UI.cur=monthAdd(UI.cur,-1);UI.day='all';render()}
  else if(a==='mnext'){UI.cur=monthAdd(UI.cur,1);UI.day='all';render()}
  else if(a==='themeset'){var ae=document.getElementById('aEmail');if(ae)AUTH.email=ae.value.trim();setTheme(el.dataset.t);if(!document.getElementById('auth').hidden)renderAuth();else render()}
  else if(a==='resend'){
    if(Date.now()<(AUTH.resendAt||0))return;
    var rk=el.dataset.k,rm=rk==='recovery'?'resetcode':'verify';
    (rk==='recovery'?SB.auth.resetPasswordForEmail(AUTH.email):SB.auth.resend({type:'signup',email:AUTH.email})).then(function(r){
      if(r.error){authView(rm,tr(r.error));return}
      AUTH.resendAt=Date.now()+60000;authView(rm,'Enviamos um novo código.','ok')
    },function(er){authView(rm,tr(er))})}
  else if(a==='palopen'){UI.pal=UI.pal===el.dataset.p?null:el.dataset.p;render()}
  else if(a==='goaladd'){openGoal()}
  else if(a==='goaledit'){openGoal(el.dataset.id)}
  else if(a==='goaldep'){openDep(el.dataset.id)}
  else if(a==='goaldel'){if(!el.dataset.sure){el.dataset.sure='1';el.textContent='Confirmar exclusão';return}
    S.goals=goalsList().filter(function(g){return g.id!==el.dataset.id});closeModal();change()}
  else if(a==='np'){S.st=S.st||1;S.np=parseInt(el.dataset.n,10)||2;change()}
  else if(a==='showpw'){var inp=el.parentElement.querySelector('input');if(inp){var show=inp.type==='password';inp.type=show?'text':'password';el.innerHTML=ic(show?'eyeoff':'eye');el.setAttribute('aria-pressed',String(show));el.setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha')}}
  else if(a==='mtoday'){UI.cur=NOWKEY;UI.day='all';render()}
  else if(a==='selcard'){UI.sel=el.dataset.id;if(UI.view!=='cartoes')goView('cartoes');render();var d=document.querySelector('.detail');if(d&&window.innerWidth<860)d.scrollIntoView({behavior:'smooth',block:'start'})}
  else if(a==='day'){UI.day=el.dataset.d;render()}
  else if(a==='saveall'){m=getMonth(UI.cur);var cc=calc();m.save={};PS().forEach(function(k){m.save[k]=Math.max(0,cc.per[k].s)});change()}
  else if(a==='gomonth'){UI.cur=el.dataset.k;UI.day='all';render()}
  else if(a==='mode'){MODE=el.dataset.m==='acerto'?'acerto':'prog';try{localStorage.setItem('divida-mode',MODE)}catch(x){}render()}
  else if(a==='togbill'){m=getMonth(UI.cur);var b=bills(m).filter(function(x){return x.key===el.dataset.key})[0];if(b){var p=el.dataset.p,pfl=pf(p),to=!billPaid(b,p);b.items.forEach(function(i){if(i[p]>0)i[pfl]=to});change()}}
  else if(a==='paycard'){m=getMonth(UI.cur);var p2=el.dataset.p,pf2=pf(p2);var its=m.items.filter(function(i){return i.g===el.dataset.id&&i[p2]>0});var to2=!its.every(function(i){return i[pf2]});its.forEach(function(i){i[pf2]=to2});change()}
  else if(a==='add'){openAdd(el.dataset.g)}
  else if(a==='close'){closeModal()}
  else if(a==='del'){m=getMonth(UI.cur);var dit=null;m.items.forEach(function(i){if(i.id===el.dataset.id)dit=i});m.items=m.items.filter(function(i){return i.id!==el.dataset.id});if(dit&&dit.sid){m.del=m.del||[];if(m.del.indexOf(dit.sid)<0)m.del.push(dit.sid);removeForward(UI.cur,dit.sid)}change()}
  else if(a==='addcard'){openCard()}
  else if(a==='welinc'){openIncome()}
  else if(a==='leavegrp'){openLeave()}
  else if(a==='welmode'){openMode(false)}
  else if(a==='mdsel'){MODEST.n=parseInt(el.dataset.n,10)||1;openMode(true)}
  else if(a==='weldone'){S.st=2;change()}
  else if(a==='delcard'){var cid=el.dataset.id;S.cards=S.cards.filter(function(c){return c.id!==cid});Object.keys(S.months).forEach(function(k){S.months[k].items=S.months[k].items.filter(function(i){return i.g!==cid})});if(UI.sel===cid)UI.sel=S.cards.length?S.cards[0].id:null;change()}
  else if(a==='reset1'){UI.confirmReset='zero';render()}
  else if(a==='reset0'){UI.confirmReset=false;render()}
  else if(a==='reset2'){
    S=blank();S.months[NOWKEY]={inc:{w:0,t:0},save:{w:0,t:0},items:[]};COL={};
    UI.confirmReset=false;UI.cur=NOWKEY;UI.day='all';UI.sel=S.cards.length?S.cards[0].id:null;change()}
  else if(a==='amode'){var ee=document.getElementById('aEmail');if(ee)AUTH.email=ee.value.trim();authView(el.dataset.m)}
  else if(a==='mkcasal'){el.disabled=true;SB.rpc('criar_casal').then(function(r){if(r.error)throw r.error;return SB.from('casais').select('id,codigo').limit(1)}).then(function(q){if(q.error||!q.data||!q.data.length)throw (q.error||new Error('x'));CASAL=q.data[0];authView('created')}).catch(function(err){authView('setup',tr(err))})}
  else if(a==='continue'){enterApp()}
  else if(a==='retry'){if(SESSION){authedUid=null;afterAuth()}else{location.reload()}}
  else if(a==='logout'){SB.auth.signOut({scope:'local'}).then(function(){if(remote||authedUid){teardown();authView('login')}},function(){teardown();authView('login')})}
  else if(a==='copycode'){var cd=el.dataset.code||'',old=el.textContent;var ok=function(){el.textContent='Copiado!';setTimeout(function(){el.textContent=old},1600)};
    try{navigator.clipboard.writeText(cd).then(ok,function(){el.textContent=cd})}catch(x){el.textContent=cd}}
});
document.addEventListener('submit',function(e){
  if(e.target.id==='authForm'){e.preventDefault();doAuth(e.target);return}
  if(e.target.id==='goalForm'){e.preventDefault();saveGoal(e.target);return}
  if(e.target.id==='depForm'){e.preventDefault();saveDep(e.target);return}
  if(e.target.id==='leaveForm'){e.preventDefault();var lb=e.target.querySelector('button[type=submit]');lb.disabled=true;
    SB.rpc('sair_do_grupo').then(function(r){if(r.error)throw r.error;
      var u=authedUid;closeModal();teardown();try{if(u)localStorage.removeItem(LS_KEY+':'+u)}catch(x){}afterAuth()
    }).catch(function(err){lb.disabled=false;openLeave(/PGRST202|could not find|sair_do_grupo/i.test((err&&err.message)||'')?'A função de sair ainda não foi ativada no banco. Veja o LEIA-ME.':tr(err))});return}
  if(e.target.id==='incForm'){e.preventDefault();PS().forEach(function(k){var f=document.getElementById('in'+k);if(f)setInc(k,Math.max(0,parseNum(f.value)))});closeModal();change();return}
  if(e.target.id==='modeForm'){e.preventDefault();var nn=MODEST.n;S.np=nn;S.names=S.names||{};PK.slice(0,nn).forEach(function(k){var f=document.getElementById('mn'+k),v=f?f.value.trim():'';if(v)S.names[k]=v});S.st=S.st||1;closeModal();change();return}
  if(e.target.id==='cardForm'){e.preventDefault();var cid='c'+uid().slice(-6),cv=parseInt(document.getElementById('cdV').value,10);S.cards.push({id:cid,name:document.getElementById('cdN').value.trim()||'Novo cartão',color:CARDCOL[S.cards.length%CARDCOL.length],venc:(cv>=1&&cv<=31)?cv:null});UI.sel=cid;closeModal();change();return}
  if(e.target.id!=='addForm')return;e.preventDefault();
  var it={id:uid(),sid:uid(),g:document.getElementById('fG').value,n:document.getElementById('fN').value.trim()||'Lançamento',rec:false,rest:0};
  PK.forEach(function(k){var f=document.getElementById('f'+k.toUpperCase());it[k]=f?parseNum(f.value):0;it[pf(k)]=false});
  var dia=parseInt(document.getElementById('fD').value,10);if(dia>=1&&dia<=31)it.dia=dia;
  applyPlan(it,document.getElementById('fP').value);
  var mk=document.getElementById('fM').value||UI.cur;
  if(mk!==UI.cur)UI.cur=mk;
  getMonth(mk).items.push(it);closeModal();change()
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!document.getElementById('modal').hidden)closeModal()});
document.addEventListener('change',function(e){
  var el=e.target,f=el.dataset&&el.dataset.f;if(!f)return;
  var m=getMonth(UI.cur),it;
  if(f==='inc'){
    setInc(el.dataset.p,parseNum(el.value));
  }
  else if(f==='save'){m.save=m.save||{};m.save[el.dataset.p]=Math.max(0,parseNum(el.value))}
  else if(f==='pcolor'){S.pc=S.pc||{};S.pc[el.dataset.p]=el.value}
  else if(f==='goal'){S.goal=Math.max(0,parseNum(el.value))}
  else if(f==='name'){S.st=S.st||1;S.names[el.dataset.p]=el.value.trim()||PDEF[el.dataset.p]}
  else if(f==='cname'){var c=cardOf(el.dataset.id);if(c)c.name=el.value.trim()||'Cartão'}
  else if(f==='cvenc'){var c2=cardOf(el.dataset.id);if(c2){var d=parseInt(el.value,10);c2.venc=(d>=1&&d<=31)?d:null}}
  else if(f==='ccolor'){var c3=cardOf(el.dataset.id);if(c3)c3.color=el.value}
  else{it=findItem(el.dataset.id);if(!it)return;
    if(f==='n')it.n=el.value.trim()||'Lançamento';
    else if(PK.indexOf(f)>-1)it[f]=parseNum(el.value);
    else if(f==='dia'){var dd=parseInt(el.value,10);it.dia=(dd>=1&&dd<=31)?dd:null}
    else if(f==='plan')applyPlan(it,el.value);
    else if(f==='pw'||f==='pt'||f==='pa'||f==='pb')it[f]=el.checked;
    if(f==='n'||PK.indexOf(f)>-1||f==='dia'||f==='plan')propagate(UI.cur,it)}
  change()
});

function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
UI.sel=S.cards.length?S.cards[0].id:null;
applyTheme();
boot();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
